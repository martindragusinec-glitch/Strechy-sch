<!doctype html><meta charset="utf-8"><title>banner</title>
<style>
@font-face{font-family:P;src:url(../assets/fonts/poppins-400-latin-ext.woff2) format("woff2");font-weight:400;unicode-range:U+0100-024F,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF}
@font-face{font-family:P;src:url(../assets/fonts/poppins-400-latin.woff2) format("woff2");font-weight:400}
@font-face{font-family:P;src:url(../assets/fonts/poppins-500-latin-ext.woff2) format("woff2");font-weight:500;unicode-range:U+0100-024F,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF}
@font-face{font-family:P;src:url(../assets/fonts/poppins-500-latin.woff2) format("woff2");font-weight:500}
@font-face{font-family:P;src:url(../assets/fonts/poppins-600-latin-ext.woff2) format("woff2");font-weight:600;unicode-range:U+0100-024F,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF}
@font-face{font-family:P;src:url(../assets/fonts/poppins-600-latin.woff2) format("woff2");font-weight:600}
:root{--red:#DA000F;--green:#24A531;--green-dark:#1B7C25;--ink:#1B2028;--ink-3:#5c636b}
html,body{margin:0;background:#12161C;font-family:P,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.b{position:relative;overflow:hidden;width:var(--w);height:var(--h);isolation:isolate}
.bg{position:absolute;inset:0;background:var(--img) var(--pos,50% 100%)/var(--bgs,cover) no-repeat;z-index:-2}
.ov{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(18,22,28,.5) 0%,rgba(18,22,28,.06) 14%,rgba(18,22,28,.12) 30%,rgba(18,22,28,.86) var(--dark,46%),rgba(18,22,28,.98) 100%)}
.in{position:absolute;inset:0;padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:flex-end;gap:var(--gap)}
.top{position:absolute;left:var(--px);right:var(--px);top:var(--pt);display:flex;justify-content:space-between;align-items:flex-start}
.nzu{height:var(--logo);width:auto}
.sch{height:calc(var(--logo)*.42);width:auto;margin-top:calc(var(--logo)*.22)}
.q{font-size:var(--q);line-height:1.05;letter-spacing:-.03em;font-weight:600;text-wrap:balance}
.q em{font-style:normal;display:inline-block;background:var(--green);color:#fff;padding:.02em .26em .06em;border-radius:.2em;white-space:nowrap}
.offer{font-size:var(--hf);line-height:1.08;letter-spacing:-.025em;font-weight:600;color:rgba(255,255,255,.92)}
.offer .hl{display:inline-block;background:var(--green);color:#fff;padding:.02em .28em .06em;border-radius:.22em;white-space:nowrap}
.tiles{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--tg)}
.tile{position:relative;border-radius:var(--tr);overflow:hidden;aspect-ratio:var(--ta);background:#000}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:var(--tp);font-size:var(--tf);font-weight:600;line-height:1.2;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.78))}
.tile small{display:block;font-weight:400;font-size:.8em;color:rgba(255,255,255,.8);margin-top:.15em}
.plus{width:var(--plus);height:var(--plus);border-radius:50%;background:var(--green);display:grid;place-items:center;font-size:calc(var(--plus)*.7);font-weight:600;line-height:1;box-shadow:0 0 0 calc(var(--plus)*.14) #12161C}
.price{display:flex;align-items:center;gap:var(--tg);flex-wrap:wrap}
.price .lbl{font-size:var(--sub);color:rgba(255,255,255,.75);font-weight:500}
.price .amt{font-size:calc(var(--hf)*1.05);font-weight:600;letter-spacing:-.04em;line-height:1;background:var(--green);padding:.06em .3em .12em;border-radius:.2em;white-space:nowrap}
.tag{display:inline-flex;align-items:baseline;gap:.4em;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35);color:#fff;font-size:calc(var(--hf)*.44);font-weight:500;line-height:1;padding:.45em .7em;border-radius:10px;white-space:nowrap;backdrop-filter:blur(6px)}
.tag u{text-decoration:none;font-size:.72em;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:500}
.tag s{position:relative;text-decoration:none;font-weight:600}
.tag s::after{content:"";position:absolute;left:-.1em;right:-.1em;top:50%;height:.11em;margin-top:-.05em;background:var(--red);border-radius:2px}
.sub{font-size:var(--sub);line-height:1.35;color:rgba(255,255,255,.86);font-weight:500;text-wrap:balance}
.sub b{color:#fff;font-weight:600}
.who{font-size:calc(var(--sub)*.82);line-height:1.4;color:rgba(255,255,255,.8)}
.who em{font-style:normal;background:var(--green);color:#fff;padding:.04em .3em;border-radius:.2em}
.sub .tag{font-size:.78em}
.bot{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:calc(var(--gap)*.3)}
.cta{display:inline-flex;align-items:center;gap:.5em;background:var(--red);color:#fff;font-weight:600;font-size:var(--cta);padding:.72em 1.1em;border-radius:12px;white-space:nowrap}
.cta svg{width:1em;height:1em}
.trust{font-size:calc(var(--sub)*.7);color:rgba(255,255,255,.75);text-align:right;line-height:1.35;flex:1;min-width:0}
.trust b{color:#fff;font-weight:600}
.stick{position:absolute;right:var(--px);top:calc(var(--pt) + var(--logo)*1.35);background:#FFD23F;color:#1B2028;font-weight:600;font-size:var(--sf);line-height:1.05;text-align:center;padding:.5em .8em;border-radius:12px;transform:rotate(-6deg);box-shadow:0 14px 34px -12px rgba(0,0,0,.7);text-transform:uppercase;letter-spacing:.02em}
.stick b{display:block;font-size:1.35em;letter-spacing:-.02em}
/* POZOR! – zpravodajský styl */
.alert{display:inline-flex;align-items:center;gap:.45em;background:var(--red);color:#fff;font-weight:600;font-size:calc(var(--q)*.42);letter-spacing:.06em;text-transform:uppercase;padding:.28em .7em .3em;border-radius:8px;line-height:1}
.alert i{width:.5em;height:.5em;border-radius:50%;background:#fff;box-shadow:0 0 0 .18em rgba(255,255,255,.35)}
.b.pozor .q{text-transform:uppercase;letter-spacing:-.01em;line-height:1.02;font-size:calc(var(--q)*.92)}
.b.pozor .q em{background:none;padding:0;color:#fff;border-radius:0}
.only{display:flex;align-items:center;gap:.45em;flex-wrap:wrap}
.only .lbl{font-size:calc(var(--sub)*1.05);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.only .amt{font-size:calc(var(--hf)*1.3);font-weight:600;letter-spacing:-.04em;line-height:1;background:var(--green);padding:.06em .32em .12em;border-radius:.2em;white-space:nowrap}
.ticker{display:flex;align-items:stretch;border-radius:10px;overflow:hidden;background:#fff;color:var(--ink);font-size:calc(var(--sub)*.8);font-weight:500;line-height:1.2}
.ticker b{flex:none;display:flex;align-items:center;background:var(--red);color:#fff;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:0 .9em;font-size:.85em}
.ticker span{padding:.6em .9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker span em{font-style:normal;color:var(--red);padding:0 .35em}
/* ULTRA POZOR – typografický, bez fotky */
.b.ultra{background:var(--red)}
.b.ultra .bg,.b.ultra .ov,.b.ultra .stick{display:none}
.b.ultra .sch{filter:brightness(0) invert(1)}
.b.ultra::before,.b.ultra::after{content:"";position:absolute;left:0;right:0;height:calc(var(--sub)*.6);background:repeating-linear-gradient(-45deg,rgba(255,255,255,.85) 0 calc(var(--sub)*.7),transparent calc(var(--sub)*.7) calc(var(--sub)*1.4));z-index:1}
.b.ultra::before{top:0}
.b.ultra::after{bottom:0}
.b.ultra .in{justify-content:center;gap:calc(var(--gap)*.9)}
.b.ultra .top{position:absolute}
.ultra__pozor{font-size:calc(var(--q)*2.1);line-height:.9;letter-spacing:-.04em;font-weight:600;text-transform:uppercase;color:#fff}
.ultra__pozor small{display:block;font-size:.19em;letter-spacing:.22em;font-weight:600;opacity:.85;margin-bottom:.35em}
.ultra__h{font-size:calc(var(--q)*.88);line-height:1.02;letter-spacing:-.015em;font-weight:600;text-transform:uppercase;color:#fff;text-wrap:balance}
.ultra__box{background:#fff;color:var(--ink);border-radius:20px;padding:calc(var(--sub)*.8) calc(var(--sub)*1.1);display:grid;grid-template-columns:auto 1fr;grid-template-areas:"lbl amt" "was amt";align-items:center;column-gap:var(--tg);row-gap:.2em}
.ultra__box .lbl{grid-area:lbl;align-self:end}
.ultra__box .was{grid-area:was;align-self:start}
.ultra__box .amt{grid-area:amt;justify-self:end}
.ultra__box .lbl{font-size:calc(var(--sub)*.95);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.ultra__box .amt{font-size:calc(var(--hf)*1.6);font-weight:600;letter-spacing:-.045em;line-height:1;color:var(--green-dark)}
.ultra__box .was{font-size:calc(var(--sub)*.9);color:var(--ink-3);font-weight:500}
.ultra__box .was s{position:relative;text-decoration:none;font-weight:600;color:var(--ink)}
.ultra__box .was s::after{content:"";position:absolute;left:-.1em;right:-.1em;top:50%;height:.11em;margin-top:-.05em;background:var(--red);border-radius:2px}
.ultra__sub{font-size:calc(var(--sub)*1.05);line-height:1.35;color:#fff;font-weight:500;text-wrap:balance}
.ultra__sub b{font-weight:600}
.b.ultra .cta{background:#fff;color:var(--red)}
.b.ultra .trust{color:rgba(255,255,255,.85)}
.b.ultra .trust b{color:#fff}
.safe{position:absolute;left:0;right:0;background:rgba(255,0,0,.25);z-index:9;pointer-events:none}
</style>
<div class="b" id="b"><div class="bg"></div><div class="ov"></div><div class="top" id="top"></div><div class="in" id="in"></div></div>
<script>
const Q=new URLSearchParams(location.search), F=Q.get('f')||'1080x1080', A=Q.get('a')||'senior';
const [W,H]=F.split('x').map(Number); const r=document.documentElement.style, b=document.getElementById('b');
r.setProperty('--w',W+'px'); r.setProperty('--h',H+'px');
const tall = H/W>1.5;
/* Meta safe zóny: Stories/Reels 9:16 → nahoře 250 px (14 %), dole 340 px (20 %) bez důležitého obsahu. Feed 1:1 → 64 px okraj. */
const v = tall ? {pt:250+40,pb:340+40,px:72,logo:70,q:92,hf:60,sub:33,cta:38,gap:28,tg:24,tr:24,ta:'16/9',tp:'14px 20px',tf:29,plus:70,sf:24,bgs:'145%',dark:'50%'}
               : {pt:64,pb:64,px:64,logo:60,q:66,hf:44,sub:26,cta:31,gap:18,tg:18,tr:18,ta:'2/1',tp:'10px 16px',tf:23,plus:54,sf:20,bgs:'cover',dark:'44%'};
for (const k in v) r.setProperty('--'+k, typeof v[k]==='number' ? v[k]+'px' : v[k]);
const IMG={senior:['src/couple-story.jpg','50% 100%'],nizkoprijmove:['src/mother-story.jpg','50% 100%'],osvc:['src/osvc-story.jpg','50% 100%'],broad:[tall?'src/house-story.jpg':'src/house-sq.jpg','50% 0%'],pozor:[tall?'src/house-story.jpg':'src/house-sq.jpg','50% 0%'],ultrapozor:['','50% 50%']};
if(A==='broad'||A==='pozor'){ r.setProperty('--bgs', tall?'118%':'cover'); r.setProperty('--dark', tall?'52%':'46%'); }
const [img,pos]=IMG[A]; r.setProperty('--img',`url(${img})`); r.setProperty('--pos',pos);
const ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const T={
 senior:{q:'Pobíráte <em>starobní důchod?</em>', sub:'Dotace <b>320&nbsp;000&nbsp;Kč přijde na účet předem</b>, ještě před montáží. Vyřídíme ji za vás.', cta:'Ověřit nárok zdarma'},
 nizkoprijmove:{q:'Pobíráte <em>superdávku?</em>', sub:'Stát zaplatí <b>320&nbsp;000&nbsp;Kč předem na účet.</b> Vy doplatíte jen zbytek, nic nepředplácíte.', cta:'Ověřit nárok za minutu'},
 osvc:{q:'Jste OSVČ <em>s&nbsp;nižšími příjmy?</em>', sub:'Na dotaci <b>320&nbsp;000&nbsp;Kč předem na účet</b> máte nárok i&nbsp;jako živnostník.', cta:'Spočítat můj doplatek'},
 ultrapozor:{ultra:true},
 pozor:{alert:true, noPrice:true, q:'Fotovoltaika se&nbsp;zateplením střechy', sub:'Dotace <b>320&nbsp;000&nbsp;Kč přijde na účet předem.</b> Doplatek jen za zbytek.', cta:'Ověřit nárok zdarma'},
 broad:{q:'Fotovoltaika i&nbsp;zateplení střechy <em>za 65&nbsp;500&nbsp;Kč</em>', noPrice:true, sub:'Zbytek zaplatí dotace NZÚ&nbsp;Light, <b>přijde předem na účet.</b>', who:'Pro <em>nízkopříjmové domácnosti,</em> seniory, OSVČ a&nbsp;invalidní důchodce 3.&nbsp;stupně', cta:'Spočítat doplatek'}
};
const t=T[A];
document.getElementById('top').innerHTML='<img class="nzu" src="../assets/img/nzu-light-logo-dark.png"><img class="sch" src="../assets/img/schlieger-logo-white.svg">';
const st=document.createElement('div'); st.className='stick'; st.innerHTML='Dotace předem<b>320 000 Kč</b>na účet'; if(tall){st.style.top='calc(var(--pt) + var(--logo)*1.6)';} b.appendChild(st);
if(t.alert){ b.classList.add('pozor'); }
if(t.ultra){ b.classList.add('ultra'); }
document.getElementById('in').innerHTML= t.ultra ? `
  <div class="ultra__pozor"><small>Důležité upozornění</small>POZOR!</div>
  <div class="ultra__h">Fotovoltaika se zateplením střechy</div>
  <div class="ultra__box"><span class="lbl">Pouze za</span><span class="amt">65&nbsp;500&nbsp;Kč</span><span class="was">místo <s>385&nbsp;500&nbsp;Kč</s></span></div>
  <div class="ultra__sub">Dotace <b>320&nbsp;000&nbsp;Kč přijde na účet předem.</b> Pro důchodce, OSVČ a&nbsp;nízkopříjmové domácnosti.</div>
  <div class="bot"><span class="cta">Ověřit nárok zdarma${ARROW}</span><div class="trust"><b>Do 24 h</b> víte, zda máte nárok<br><b>23 000+</b> instalací · nezávazně</div></div>` : `
  ${t.alert?'<div><span class="alert"><i></i>Pozor!</span></div>':''}
  <div class="q">${t.q}</div>
  ${t.alert?'<div class="only"><span class="lbl">pouze za</span><span class="amt">65&nbsp;500&nbsp;Kč</span><span class="tag"><u>místo</u><s>385&nbsp;500&nbsp;Kč</s></span></div>':''}
  <div class="tiles">
    <div class="tile"><img src="../assets/img/realizace-zbraslavice-1.jpg"><span>Fotovoltaika<small>3,69 kWp, ohřev vody</small></span></div>
    <div class="plus">+</div>
    <div class="tile"><img src="src/attic.jpg"><span>Zateplení střechy<small>100 m², mezi krokve</small></span></div>
  </div>
  ${t.noPrice?'':'<div class="price"><span class="lbl">Obojí za</span><span class="amt">65&nbsp;500&nbsp;Kč</span><span class="tag"><u>místo</u><s>385&nbsp;500&nbsp;Kč</s></span></div>'}
  <div class="sub">${t.sub}${(t.noPrice&&!t.alert)?' <span class="tag" style="vertical-align:middle;margin-left:.3em"><u>místo</u><s>385&nbsp;500&nbsp;Kč</s></span>':''}</div>${t.who?`<div class="who">${t.who}</div>`:''}
  ${t.alert?'<div class="ticker"><b>Aktuálně</b><span>Pro důchodce, OSVČ a nízkopříjmové domácnosti <em>▪</em> Dotaci vyřídíme za vás</span></div>':''}
  <div class="bot"><span class="cta">${t.cta}${ARROW}</span><div class="trust"><b>Do 24 h</b> víte, zda máte nárok<br><b>23 000+</b> instalací · nezávazně</div></div>`;
if (Q.get('safe') && tall){ for (const [top,h] of [[0,250],[H-340,340]]){ const d=document.createElement('div'); d.className='safe'; d.style.top=top+'px'; d.style.height=h+'px'; b.appendChild(d);} }
document.title=`sch-fve-${A}-${F}`;
</script>
